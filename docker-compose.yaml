services:
  peagen-com:
    build: .
    container_name: peagen-com
    restart: unless-stopped
    labels:
      site.host: peagen.com
      site.kind: mdwrk-lander
    expose:
      - "80"
    networks:
      peagen-com-private: {}
      portwyrm-edge:
        aliases:
          - peagen-com

networks:
  peagen-com-private:
    name: peagen-com-private
    internal: true
  portwyrm-edge:
    name: portwyrm-edge
    external: true
